<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carte des prix — Vico chips de lentilles</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/donnees.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<div class="wrap">
  <h1>Carte des prix en France</h1>
  <p class="lead">Un magasin par enseigne dans chaque ville. Cliquez sur une ville pour voir le détail des prix.</p>

  <div class="card">
    <div class="controls">
      <label>Afficher<select id="prod"></select></label>
      <label>Enseigne<select id="ens"></select></label>
    </div>
    <div class="grid g2" style="grid-template-columns:2fr 1fr">
      <div id="map"></div>
      <div>
        <h3 id="titreClassement">Classement</h3>
        <table id="classement"></table>
        <p class="note" id="lecture"></p>
      </div>
    </div>
  </div>
</div>
<script>
const sp = document.getElementById('prod'), se = document.getElementById('ens');
sp.innerHTML = `<option value="idx">Indice de prix global (tous produits)</option>` +
  DATA.produits.map(p => `<option value="${p.id}"${p.id === VICO ? ' selected' : ''}>${p.marque} – ${p.nom} (${p.format})</option>`).join('');
option(se, ENSEIGNES, v => v, 'Toutes les enseignes');

const map = L.map('map', { scrollWheelZoom: false }).setView([46.6, 2.4], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 10 }).addTo(map);
const layer = L.layerGroup().addTo(map);

function valeurVille(ville, p, enseigne) {
  if (p === 'idx') return indice(lignes({ ville, enseigne }));
  const ls = lignes({ ville, enseigne, p: +p });
  return ls.length ? mean(ls.map(l => l.kg)) : null;
}
function draw() {
  const p = sp.value, enseigne = se.value;
  layer.clearLayers();
  const vals = DATA.villes.map(c => ({ c, v: valeurVille(c.nom, p, enseigne) }));
  const ok = vals.filter(x => x.v != null);
  const moyNat = p === 'idx' ? 100 : MOY_NAT[+p];
  vals.forEach(({ c, v }) => {
    const rel = v == null ? null : 100 * v / moyNat;
    const m = L.circleMarker([c.lat, c.lng], { radius: 20, weight: 2, color: '#333', fillOpacity: .85, fillColor: p === 'idx' ? couleurIndice(rel, 94, 106) : couleurIndice(rel, 90, 110) }).addTo(layer);
    m.bindTooltip(`<b>${c.nom}</b><br>${v == null ? 'non relevé' : (p === 'idx' ? 'indice ' + fmt(v, 1) : eur(v) + '/kg')}`, { direction: 'top' });
    let html = `<b>${c.nom}</b> <span class="note">(${c.region})</span><br>`;
    if (p === 'idx') {
      html += ENSEIGNES.map(e => { const s = DATA.magasins.find(m => m.ville === c.nom && m.enseigne === e); const ix = indice(lignes({ ville: c.nom, enseigne: e }));
        return `${e} : ${ix == null ? 'n.d.' : 'indice ' + fmt(ix, 1)}${s ? ' <span class="note">– ' + s.nom + '</span>' : ''}`; }).join('<br>');
    } else {
      html += ENSEIGNES.map(e => { const l = lignes({ ville: c.nom, enseigne: e, p: +p })[0];
        return `${e} : ${l ? eur(l.prix) + ' (' + eur(l.kg) + '/kg)' : 'n.d.'}`; }).join('<br>');
    }
    m.bindPopup(html);
    if (v != null) L.marker([c.lat, c.lng], { icon: L.divIcon({ className: '', html: `<div style="font:700 11px system-ui;text-align:center;width:44px;margin:-7px 0 0 -22px">${p === 'idx' ? fmt(v, 0) : fmt(v, 1)}</div>` }), interactive: false }).addTo(layer);
  });
  ok.sort((a, b) => a.v - b.v);
  document.getElementById('titreClassement').textContent = 'Classement' + (enseigne ? ' – ' + enseigne : '');
  document.getElementById('classement').innerHTML = `<tr><th>Ville</th><th class="n">${p === 'idx' ? 'Indice' : '€/kg'}</th><th class="n">vs moyenne</th></tr>` +
    ok.map(x => `<tr><td>${x.c.nom}</td><td class="n">${p === 'idx' ? fmt(x.v, 1) : fmt(x.v)}</td><td class="n" style="color:${x.v / moyNat > 1 ? 'var(--bad)' : 'var(--good)'}">${pct(x.v / moyNat - 1, 1)}</td></tr>`).join('');
  document.getElementById('lecture').innerHTML = p === 'idx'
    ? 'Indice 100 = prix moyen national. Calculé sur tous les produits trouvés dans la ville. Vert = moins cher, rouge = plus cher. Attention : pas d\'Auchan à Rennes, ce qui fait baisser son indice.'
    : `Moyenne des enseignes relevées dans chaque ville. Moyenne nationale : ${eur(moyNat)}/kg.`;
}
sp.onchange = se.onchange = draw;
draw();
</script>
</body>
</html>
